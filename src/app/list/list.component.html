<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">

      <!-- Header -->
      <div class="mb-4">
        <h3 class="fw-bold mb-1">🎵 My Songs</h3>
        <p class="text-muted mb-0">
          Choose a song to start listening
        </p>
      </div>

      <!-- Song List -->
      <div *ngFor="let i of songList" class="mb-2">

        <button
          type="button"
          class="song-card w-100 border-0 text-start"
          (click)="playSong(i)"
        >

          <!-- Album Icon -->
          <div class="song-icon">
            🎵
          </div>

          <!-- Song Details -->
          <div class="song-info">

            <div class="song-title text-truncate">
              {{ i["title"] }}
            </div>

            <div class="song-artist text-truncate">
              {{ i["artist"] }}
            </div>

          </div>

          <!-- Duration -->
          <div class="song-duration">
            {{ i["time"] }}
          </div>

          <!-- Play Button -->
          <div class="play-icon">
            ▶
          </div>

        </button>

      </div>

    </div>
  </div>

</div>
