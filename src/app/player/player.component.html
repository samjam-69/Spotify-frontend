<div
  class="fixed-bottom bg-dark text-white shadow-lg border-top border-secondary"
  style="z-index: 1030;"
>
  <div class="container-fluid px-3 py-2">

    <div class="row align-items-center g-3">

      <!-- Song Information -->
      <div class="col-12 col-md-4">
        <div class="d-flex align-items-center">

          <!-- Album Art -->
          <div
            class="rounded-3 d-flex align-items-center justify-content-center
                   flex-shrink-0 me-3 shadow"
            style="
              width: 56px;
              height: 56px;
              background: linear-gradient(135deg, #6f42c1, #0d6efd);
              font-size: 25px;
            "
          >
            🎵
          </div>

          <!-- Song Details -->
          <div class="overflow-hidden">

            <div
              class="fw-semibold text-truncate"
              style="font-size: 15px;"
            >
              {{ song.title || 'No song selected' }}
            </div>

            <div
              class="text-secondary text-truncate"
              style="font-size: 13px;"
            >
              {{ song.artist || 'Select a song to play' }}
            </div>

          </div>

        </div>
      </div>


      <!-- Audio Player -->
      <div class="col-12 col-md-8">

        <div
          *ngIf="url"
          class="audio-wrapper rounded-pill px-2 py-1"
        >
          <audio
            controls
            class="w-100"
            [src]="url"
          ></audio>
        </div>

        <!-- Empty State -->
        <div
          *ngIf="!url"
          class="text-center text-secondary small py-2"
        >
          🎧 Select a song to start listening
        </div>

      </div>

    </div>

  </div>
</div>
